		<script>
			// Auto-cleanup stale service workers and bad cached bundles on rbuilder.space
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.getRegistrations().then(function(registrations) {
					for (var i = 0; i < registrations.length; i++) {
						registrations[i].unregister();
					}
				});
			}
			if ('caches' in window) {
				caches.keys().then(function(names) {
					for (var i = 0; i < names.length; i++) {
						caches.delete(names[i]);
					}
				});
			}

			// Automatic recovery from stale cached chunks / deployments
			function handleChunkError() {
				var lastReload = sessionStorage.getItem('rb_auto_reload');
				var now = Date.now();
				if (!lastReload || now - parseInt(lastReload, 10) > 5000) {
					sessionStorage.setItem('rb_auto_reload', now.toString());
					window.location.reload();
				}
			}

			window.addEventListener('vite:preloadError', function(e) {
				if (e && e.preventDefault) e.preventDefault();
				handleChunkError();
			});

			window.addEventListener('error', function(e) {
				var msg = (e && (e.message || (e.target && e.target.src))) || '';
				if (
					typeof msg === 'string' &&
					(msg.indexOf("Unexpected token '<'") !== -1 ||
					 msg.indexOf("Failed to fetch dynamically imported module") !== -1 ||
					 msg.indexOf("Failed to load module script") !== -1 ||
					 msg.indexOf("MIME type") !== -1 ||
					 msg.indexOf("static/") !== -1)
				) {
					handleChunkError();
				}
			}, true);
		</script>
		<title>rbuilder — Professional Resume Builder</title>
	</head>
	<body>
		<!-- Main React application root -->
		<div id="app"></div>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
